<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Smart Certificates</title>
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f9fb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      background: #2d89ef;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .navbar .logo {
      display: flex;
      align-items: center;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
    }
    .navbar .logo img {
      height: 32px;
      margin-right: 10px;
    }

    /* Auth container */
    .auth-container {
      background: white;
      max-width: 400px;
      margin: auto;    /* centers vertically & horizontally */
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.1);
    }
    .auth-container h2 {
      text-align: center;
      color: #2d89ef;
      margin-bottom: 25px;
      font-weight: 700;
      font-size: 1.8rem;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    input[type="text"], input[type="password"] {
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #2d89ef;
      outline: none;
    }
    button {
      background-color: #2d89ef;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 5px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #185abd;
    }
    p {
      text-align: center;
      margin-top: 18px;
      font-size: 0.9rem;
      color: #555;
    }
    p a {
      color: #2d89ef;
      text-decoration: none;
      font-weight: 600;
    }
    p a:hover {
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .auth-container {
        margin: 30px 20px;
        padding: 20px;
      }
    }
    @media (max-width: 480px) {
      .auth-container {
        margin: 20px 15px;
        padding: 20px;
      }
      .navbar .logo {
        font-size: 1.1rem;
      }
      .navbar .logo img {
        height: 28px;
        margin-right: 8px;
      }
      input[type="text"], input[type="password"] {
        font-size: 0.95rem;
        padding: 10px 12px;
      }
      button {
        font-size: 1rem;
        padding: 12px;
      }
      .auth-container h2 {
        font-size: 1.5rem;
        margin-bottom: 20px;
      }
      p {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="logo.jpeg" alt="Logo" />
      Smart Certificates
    </div>
  </nav>

  <!-- Login Form -->
  <div class="auth-container">
    <h2>Login</h2>
    <form onsubmit="return loginUser(event)">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <p>Don’t have an account? <a href="register.html">Register</a></p>
  </div>

  <script>
    function loginUser(e) {
      e.preventDefault();
      // TODO: Add authentication logic (check username/password)
      // For now, just redirect user on login
      window.location.href = "home.html";
      return false;
    }
  </script>
</body>
</html>
